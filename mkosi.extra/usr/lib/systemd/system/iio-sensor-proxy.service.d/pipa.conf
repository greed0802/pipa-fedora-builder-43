[Unit]
# Order behind the sensor-DSP tunnel (Wants keeps the proxy startable even
# if the tunnel unit is masked on a machine without the DSP).
Wants=hexagonrpcd-sdsp.service
After=hexagonrpcd-sdsp.service
# Tearing the tunnel down must not leave a proxy behind that talks into a
# dead FastRPC session.
PartOf=hexagonrpcd-sdsp.service

# Sensors die across suspend when the proxy is allowed to keep polling while
# the SoC goes down (in-flight QMI-over-QRTR reads hang the process and
# corrupt the DSP session). Stop the proxy before sleep instead of guessing
# after resume; pipa-sensor-resume.service brings it back once the DSP
# answers again. Conflicts stop the proxy when suspend.target is activated
# and keep it stopped until explicitly started (Restart= is not honored for
# conflict-stopped units).
Conflicts=suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target
Before=suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target

[Service]
# Discovery opens every tagged SSC sensor synchronously; on a cold DSP this
# can take longer than the 5s default at first boot.
TimeoutStartSec=90
# libssc close/open roundtrips can block during the suspend race; do not let
# systemd SIGKILL a half-stopped proxy into a stuck DSP session too early.
TimeoutStopSec=15
# Do not start polling until the SLPI actually reports a measurement, so the
# first ClaimAccelerometer() from the desktop is answered instead of racing
# an unready DSP.
ExecStartPre=/usr/local/bin/pipa-wait-ssc
