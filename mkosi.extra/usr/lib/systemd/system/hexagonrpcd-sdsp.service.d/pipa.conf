[Unit]
# Ordering: the persist layout must exist before the tunnel is served, and
# the SensorPD reads the mapped registry while attaching.
Requires=pipa-sensors-persist.service
After=pipa-sensors-persist.service

[Service]
# Explicit firmware root: works for hexagonrpcd 0.4.x (no DT autodetect) and
# 0.5.x alike. This is the dir xiaomi-pipa-firmware populates (sensors/,
# dsp/, acdb/, socinfo/).
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom/sm8250/Xiaomi/pipa
# The FastRPC listener can die during resume before pipa-sensor-resume gets
# to run; make sure systemd recovers it on its own as well.
RestartSec=2
